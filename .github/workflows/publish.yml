name: Publish with search discovery checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcbridge-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publishing invariants
        run: python3 -m unittest discover -s scripts -p 'test_search_sync.py'
      - name: Generate and save public discovery files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/sync-search.py --write
            python3 scripts/sync-search.py
            python3 scripts/check-site.py
            git add sitemap.xml llms.txt robots.txt search-manifest.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Keep public search discovery in sync'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify published discovery and private file exclusions
        run: python3 scripts/check-published-search.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for overlapping branch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              request = Request('https://api.github.com/repos/' + repo + path,
                                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                         'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          if api('/pages').get('build_type') == 'legacy':
              # Until an administrator selects Actions as the Pages source, the
              # legacy build can race our generated artifact. Publish ours last.
              for attempt in range(60):
                  runs = api('/actions/runs?per_page=50')['workflow_runs']
                  legacy = [r for r in runs if r['head_sha'] == os.environ['GITHUB_SHA']
                            and r.get('path') == 'dynamic/pages/pages-build-deployment']
                  if legacy and all(r['status'] == 'completed' for r in legacy):
                      print('Legacy deployment finished; publishing validated discovery files last.')
                      break
                  time.sleep(10)
              else:
                  raise SystemExit('Legacy deployment did not finish; retry after it completes.')
          PY
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
