<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" role="img" aria-label="LC Bridge">
  <!-- Small-size variant of the LC Bridge mark. The full lockup carries four piers
       and two abutments; below ~24px those strokes merge into a smudge, which is
       what Google renders at 16px. This drawing keeps the silhouette — rounded
       cobalt tile, white arch — and reduces it to one centre support with heavier
       strokes so it stays legible in a search result. Do not thin these strokes. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3047C0"/>
      <stop offset="1" stop-color="#6938EF"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 17V12.6"/>
    <path d="M19.8 17V12.6"/>
    <path d="M4.2 12.6C4.2 8.9 7.6 7 12 7s7.8 1.9 7.8 5.6"/>
    <path d="M12 10.3V17"/>
  </g>
</svg>
